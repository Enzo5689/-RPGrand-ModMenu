<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Dönerci Usta</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#201610;color:#fff3df;font-family:system-ui}

header{background:#8c291c;padding:16px;text-align:center}

h1{margin:0}

.stats{display:flex;justify-content:space-around;background:#35241a;padding:12px;font-weight:bold}

main{max-width:520px;margin:auto;padding:12px}

.card{background:#3b291e;border:1px solid #6e4b31;border-radius:16px;padding:15px;margin-bottom:12px}

.customer{text-align:center;font-size:55px}

#order{text-align:center;font-size:19px;color:#ffd16b;font-weight:bold}

#plate{min-height:130px;background:#f1d5a2;border:8px solid #fff0d0;border-radius:50%;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:5px;padding:20px;margin:12px auto;color:#35241a}

.ingredients{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

button{border:0;border-radius:12px;padding:12px;background:#f1bd58;color:#321b0d;font-weight:800;font-size:14px;touch-action:manipulation}

button:disabled{opacity:.4}

.primary{width:100%;background:#65cf78;font-size:17px;margin-top:10px}

.secondary{background:#d87842;color:white}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.shoprow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}

.shoprow button{max-width:130px}

#message{text-align:center;min-height:25px;color:#ffe18c;font-weight:bold}

</style>

</head>

<body>

<header><h1>🌯 DÖNERCİ USTA</h1><small>Mahallenin en iyi dönercisi!</small></header>

<div class="stats">

<div>💰 ₺<span id="money">150</span></div>

<div>⭐ <span id="rep">0</span></div>

<div>📦 <span id="served">0</span></div>

</div>

<main>

<section class="card">

<div class="customer" id="customer">🧔🏻</div>

<div id="order">Sipariş hazırlanıyor...</div>

<div id="patience"></div>

</section>

<section class="card">

<h2>👨‍🍳 Dönerini hazırla</h2>

<div id="plate">🫓</div>

<div class="ingredients">

<button onclick="add('🥙','Lavaş')">🫓 Lavaş</button>

<button onclick="add('🥩','Et')">🥩 Et</button>

<button onclick="add('🍅','Domates')">🍅 Domates</button>

<button onclick="add('🥬','Marul')">🥬 Marul</button>

<button onclick="add('🧅','Soğan')">🧅 Soğan</button>

<button onclick="add('🥒','Turşu')">🥒 Turşu</button>

<button onclick="add('🌶️','Acı sos')">🌶️ Acı sos</button>

<button onclick="add('🍟','Patates')">🍟 Patates</button>

<button onclick="add('🥤','İçecek')">🥤 İçecek</button>

</div>

<div class="actions" style="margin-top:10px">

<button class="secondary" onclick="undo()">↩️ Son malzemeyi sil</button>

<button class="secondary" onclick="clearPlate()">🗑️ Baştan yap</button>

</div>

<button class="primary" onclick="serve()">🔔 Siparişi teslim et</button>

<div id="message"></div>

</section>

<section class="card">

<h2>🏪 Dükkânını geliştir</h2>

<div class="shoprow"><div>🔥 Döner ocağı<br><small>Sipariş başına +₺5</small></div><button id="ovenBtn" onclick="buy('oven',200)">₺200 — Al</button></div>

<div class="shoprow"><div>✨ Tabela<br><small>Sipariş başına +₺10</small></div><button id="signBtn" onclick="buy('sign',350)">₺350 — Al</button></div>

<div class="shoprow"><div>👨‍🍳 Usta aşçı<br><small>Sipariş başına +₺15</small></div><button id="chefBtn" onclick="buy('chef',500)">₺500 — Al</button></div>

</section>

</main>

<script>

const recipes=[

{name:"Et döner",items:["Lavaş","Et","Domates","Soğan"],price:60},

{name:"Acılı döner",items:["Lavaş","Et","Domates","Acı sos"],price:75},

{name:"Bol malzemeli",items:["Lavaş","Et","Marul","Turşu","Patates"],price:90},

{name:"Usta menüsü",items:["Lavaş","Et","Domates","Soğan","Turşu","İçecek"],price:110},

{name:"Özel döner",items:["Lavaş","Et","Marul","Acı sos","Patates","İçecek"],price:125}

];

let money=150,rep=0,served=0,plate=[],recipe=null,busy=false;

let upgrades={oven:false,sign:false,chef:false};

const $=id=>document.getElementById(id);

function say(t){$("message").textContent=t}

function update(){

$("money").textContent=money;

$("rep").textContent=rep;

$("served").textContent=served;

for(const k of Object.keys(upgrades)){

const b=$(k+"Btn");

b.textContent=upgrades[k]?"✅ Alındı":({oven:"₺200 — Al",sign:"₺350 — Al",chef:"₺500 — Al"}[k]);

b.disabled=upgrades[k];

}

}

function render(){

$("plate").innerHTML=plate.length?plate.map(x=>'<span style="font-size:25px">'+x.emoji+'</span>').join(""):'🫓';

}

function newOrder(){

recipe=recipes[Math.floor(Math.random()*recipes.length)];

plate=[];busy=false;

$("customer").textContent=["🧔🏻","👩🏻","👨🏽","👵🏻","🧑🏻"][Math.floor(Math.random()*5)];

$("order").textContent="📋 "+recipe.name+" istiyorum!";

$("patience").textContent="Sipariş fiyatı: ₺"+recipe.price;

render();say("Siparişi hazırlamaya başla!");

}

function add(emoji,name){

if(busy||!recipe)return;

if(plate.length>=8)return say("Döner çok doldu!");

plate.push({emoji,name});render();say(name+" eklendi.");

}

function undo(){if(busy)return;plate.pop();render();say("Son malzeme silindi.")}

function clearPlate(){if(busy)return;plate=[];render();say("Baştan hazırla.")}

function serve(){

if(busy||!recipe)return;

busy=true;

const expected=[...recipe.items].sort();

const actual=plate.map(x=>x.name).sort();

const correct=expected.length===actual.length&&expected.every((v,i)=>v===actual[i]);

if(correct){

const bonus=(upgrades.oven?5:0)+(upgrades.sign?10:0)+(upgrades.chef?15:0);

const earned=recipe.price+bonus;

money+=earned;rep+=10;served++;

$("patience").textContent="😋 Müşteri memnun!";

say("Harika! +₺"+earned+" kazandın!");

}else{

money+=10;rep=Math.max(0,rep-2);

$("patience").textContent="😕 Sipariş yanlış!";

say("Yanlış malzeme. ₺10 teselli parası.");

}

update();

$("order").textContent=correct?"Sipariş teslim edildi!":"Müşteri memnun kalmadı.";

setTimeout(newOrder,1600);

}

function buy(key,cost){

if(upgrades[key])return;

if(money<cost)return say("Yeterli paran yok!");

money-=cost;upgrades[key]=true;update();say("Dükkân geliştirildi! 🎉");

}

update();newOrder();

</script>

</body>

</html>
