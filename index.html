
<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Mini Şehir 3D</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#8dc5dd;font-family:Arial;color:white;overflow:hidden}

canvas{display:block;width:100vw;height:100dvh}

#top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px}

#panel{position:absolute;right:10px;top:55px;display:grid;gap:7px}

button{background:#172536eF;color:white;border:1px solid #ffffff55;border-radius:10px;padding:11px 9px;font-weight:bold}

button.on{background:#087c5b}

#joy{position:absolute;bottom:25px;left:22px;width:110px;height:110px;border-radius:50%;background:#17253688;border:2px solid #ffffff88;touch-action:none}

#dot{position:absolute;left:33px;top:33px;width:40px;height:40px;border-radius:50%;background:#e74c65}

small{background:#172536dd;padding:9px;border-radius:9px}

</style>

</head>

<body>

<canvas id="c"></canvas>

<div id="top"><small>🏙️ MINI ŞEHİR</small><small id="stats">Can: 100</small></div>

<div id="panel">

<button id="esp">👁 ESP: KAPALI</button>

<button id="god">🛡 GOD: KAPALI</button>

<button id="aim">🎯 HEDEF: KAPALI</button>

<button id="heal">❤️ CAN DOLDUR</button>

</div>

<div id="joy"><div id="dot"></div></div>

<script>

const c=document.querySelector('#c'),x=c.getContext('2d');

let W,H,px=0,pz=0,hp=100,esp=false,god=false,aim=false,dx=0,dy=0;

function resize(){W=c.width=innerWidth;H=c.height=innerHeight}

onresize=resize;resize();

let people=Array.from({length:9},(_,i)=>({x:Math.sin(i*7)*14,z:Math.cos(i*4)*14,hp:100}));

function button(id,get,set,label){let b=document.getElementById(id);b.onclick=()=>{set(!get());b.classList.toggle('on',get());b.textContent=label+(get()?'AÇIK':'KAPALI')}}

button('esp',()=>esp,v=>esp=v,'👁 ESP: ');

button('god',()=>god,v=>god=v,'🛡 GOD: ');

button('aim',()=>aim,v=>aim=v,'🎯 HEDEF: ');

document.getElementById('heal').onclick=()=>hp=100;

const joy=document.getElementById('joy'),dot=document.getElementById('dot');

let active=false;

function move(e){if(!active)return;let r=joy.getBoundingClientRect(),p=e.touches?e.touches[0]:e;

let a=p.clientX-r.left-r.width/2,b=p.clientY-r.top-r.height/2,l=Math.hypot(a,b)||1;

a*=Math.min(1,35/l);b*=Math.min(1,35/l);dx=a/35;dy=b/35;

dot.style.left=(35+a)+'px';dot.style.top=(35+b)+'px';e.preventDefault()}

function end(){active=false;dx=dy=0;dot.style.left='33px';dot.style.top='33px'}

joy.onpointerdown=e=>{active=true;joy.setPointerCapture(e.pointerId);move(e)};

joy.onpointermove=move;joy.onpointerup=end;joy.onpointercancel=end;

function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}

function draw(){

x.clearRect(0,0,W,H);

let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#75b8d7');sky.addColorStop(1,'#d4e6c4');rect(0,0,W,H,sky);

let horizon=H*.43,scale=Math.min(W,H)*.8;

rect(0,horizon,W,H-horizon,'#4b625c');

x.fillStyle='#303840';x.beginPath();x.moveTo(W*.38,horizon);x.lineTo(W*.62,horizon);x.lineTo(W*1.2,H);x.lineTo(-W*.2,H);x.fill();

for(let i=0;i<8;i++){

let z=(i*7+((pz%7)+7)%7)%56, yy=horizon+z/56*(H-horizon);

rect(W*.5-2,yy,4,Math.max(2,z/10),'#f1df9c');

}

for(let i=0;i<18;i++){

let side=i%2?1:-1,z=(i*13+((pz%13)+13)%13)%75;

let yy=horizon+z/75*(H-horizon),sz=8+z*1.1;

let xx=W/2+side*(W*.12+z*W/100)+Math.sin(i*9)*20;

rect(xx-sz/2,yy-sz*1.7,sz,sz*1.7,['#b6a99a','#9aaeb8','#d0bca1','#8da9a2'][i%4]);

rect(xx-sz/2+sz*.18,yy-sz*1.45,sz*.2,sz*.22,'#d7eced');

rect(xx+sz*.12,yy-sz*1.45,sz*.2,sz*.22,'#d7eced');

}

let visible=people.filter(p=>p.hp>0);

visible.forEach((p,i)=>{

let rx=p.x-px,rz=p.z-pz,sc=H/(rz+24)*.65;

let xx=W/2+rx*sc*1.8,yy=H*.58+rz*sc*.7;

if(xx<0||xx>W||yy<horizon||yy>H) return;

if(esp){x.strokeStyle='#ff365b';x.lineWidth=2;x.strokeRect(xx-13*sc,yy-45*sc,26*sc,48*sc)}

x.fillStyle=aim&&p===visible[0]?'#ffe05a':'#d94e59';

x.beginPath();x.arc(xx,yy-38*sc,7*sc,0,7);x.fill();

rect(xx-6*sc,yy-31*sc,12*sc,24*sc,'#e5a13c');

});

let sy=H*.73+Math.sin(Date.now()/180)*1;

x.fillStyle='#225be4';x.beginPath();x.ellipse(W/2,sy+24,25,9,0,0,7);x.fill();

rect(W/2-13,sy-13,26,37,'#225be4');

x.fillStyle='#f0c29b';x.beginPath();x.arc(W/2,sy-24,12,0,7);x.fill();

document.getElementById('stats').textContent='Can: '+hp+(god?' · ÖLÜMSÜZ':'')+' · Hedef: '+visible.length;

requestAnimationFrame(draw)}

setInterval(()=>{if(!god&&Math.random()<.08&&hp>0)hp=Math.max(0,hp-1)},1000);

setInterval(()=>{px+=dx*.15;pz+=dy*.15},30);

draw();

</script>

</body>

</html
