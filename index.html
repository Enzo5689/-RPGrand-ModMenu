<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Türkiye Roleplay</title>

<style>

*{box-sizing:border-box}

body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#17242b;color:white}

canvas{display:block;width:100vw;height:100vh}

#menu{position:fixed;inset:0;background:linear-gradient(145deg,#263e49,#101820);display:flex;align-items:center;justify-content:center;padding:20px}

.card{width:100%;max-width:500px;background:#14232c;padding:24px;border-radius:22px;border:1px solid #52636b}

h1{font-size:36px;margin:0 0 8px;color:#f3c969}

p{color:#c1cdd2;line-height:1.5}

input,select,button{width:100%;padding:13px;margin-top:9px;border-radius:10px;border:0;font-size:16px}

input,select{background:#263944;color:white}

button{background:#334b59;color:white;font-weight:bold}

.primary{background:#f3c969;color:#17242b}

#hud{display:none;position:fixed;inset:0;pointer-events:none}

#stats{position:absolute;top:12px;left:10px;display:flex;gap:7px;flex-wrap:wrap}

.stat{background:#14232cdd;padding:10px;border-radius:10px;font-size:12px}

.stat b{display:block;color:#f3c969;margin-top:4px}

#controls{position:absolute;left:12px;bottom:20px;display:grid;grid-template-columns:55px 55px 55px;gap:5px;pointer-events:auto}

#controls button{height:48px;padding:0;font-size:22px;background:#14232cdd}

#actions{position:absolute;right:12px;bottom:20px;width:115px;display:grid;gap:7px;pointer-events:auto}

#actions button{font-size:12px;padding:13px 5px}

#message{position:absolute;top:100px;left:50%;transform:translateX(-50%);background:#14232cdd;padding:10px;border-radius:10px;font-size:13px;white-space:nowrap}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

<div class="card">

<h1>🇹🇷 Türkiye Roleplay</h1>

<p>Kendi hikâyeni yaz! Şehirde dolaş, araç sür, meslek seç ve para kazan.</p>

<label>Karakter adı</label>

<input id="name" value="Deniz Yılmaz" maxlength="18">

<label>Başlangıç bölgesi</label>

<select id="district">

<option value="center">Şehir Merkezi</option>

<option value="factory">Sanayi Bölgesi</option>

<option value="beach">Sahil Mahallesi</option>

</select>

<button class="primary" onclick="startGame()">ŞEHRE GİR →</button>

<p>🏙️ Açık şehir<br>🚘 Araç sürüşü<br>💼 Meslekler ve ekonomi</p>

</div>

</div>

<div id="hud">

<div id="stats">

<div class="stat">OYUNCU<b id="playerName">Deniz</b></div>

<div class="stat">PARA<b id="money">₺ 2.500</b></div>

<div class="stat">MESLEK<b id="job">Vatandaş</b></div>

</div>

<div id="message">Yön tuşlarıyla hareket et</div>

<div id="controls">

<button style="grid-column:2" ontouchstart="hold('up',event)" ontouchend="release('up',event)" onmousedown="hold('up',event)" onmouseup="release('up',event)">▲</button>

<button ontouchstart="hold('left',event)" ontouchend="release('left',event)" onmousedown="hold('left',event)" onmouseup="release('left',event)">◀</button>

<button ontouchstart="hold('down',event)" ontouchend="release('down',event)" onmousedown="hold('down',event)" onmouseup="release('down',event)">▼</button>

<button ontouchstart="hold('right',event)" ontouchend="release('right',event)" onmousedown="hold('right',event)" onmouseup="release('right',event)">▶</button>

</div>

<div id="actions">

<button onclick="toggleCar()">🚘 Araca bin / in</button>

<button onclick="chooseJob()">💼 Meslekler</button>

<button onclick="earn()">💵 Görev yap</button>

</div>

</div>

<script>
